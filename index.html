<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lisan — Universal Translator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at top right, #123b68 0%, transparent 35%),
        radial-gradient(circle at bottom left, #071f3b 0%, transparent 40%),
        #061426;
    color: white;
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 850px;
    margin: auto;
    min-height: 100vh;
    padding: 18px;
}

header {
    text-align: center;
    padding: 15px 0 20px;
}

.logo {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -2px;
}

.logo span {
    color: #54b7ff;
}

.subtitle {
    color: #9db4ca;
    margin-top: 5px;
    font-size: 14px;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 14px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);
    padding: 7px 13px;
    border-radius: 30px;
    font-size: 12px;
    color: #b8d5ea;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #36d98a;
    box-shadow: 0 0 10px #36d98a;
}

.languages {
    display: grid;
    grid-template-columns: 1fr 55px 1fr;
    gap: 10px;
    align-items: center;
    margin-bottom: 15px;
}

.language {
    background: rgba(255,255,255,.065);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px;
    padding: 15px;
    text-align: center;
}

.language .flag {
    font-size: 28px;
}

.language strong {
    display: block;
    margin-top: 5px;
    font-size: 16px;
}

.language small {
    color: #8da5bb;
}

.swap {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.15);
    background: #103355;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.swap:active {
    transform: scale(.93);
}

.chat {
    min-height: 330px;
    max-height: 52vh;
    overflow-y: auto;
    padding: 10px 2px 20px;
}

.empty {
    text-align: center;
    color: #7590a9;
    padding: 80px 20px;
}

.empty .big {
    font-size: 55px;
    margin-bottom: 15px;
}

.message {
    margin: 12px 0;
    display: flex;
    flex-direction: column;
}

.message.arabic {
    align-items: flex-start;
}

.message.english {
    align-items: flex-end;
}

.bubble {
    max-width: 82%;
    padding: 13px 16px;
    border-radius: 20px;
    line-height: 1.6;
    border: 1px solid rgba(255,255,255,.08);
}

.arabic .bubble {
    background: #103a62;
    border-bottom-left-radius: 5px;
}

.english .bubble {
    background: #172b42;
    border-bottom-right-radius: 5px;
}

.original {
    font-size: 15px;
    font-weight: 600;
}

.translation {
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px solid rgba(255,255,255,.1);
    color: #72c5ff;
    font-size: 16px;
}

.meta {
    color: #718ba3;
    font-size: 10px;
    margin-top: 5px;
}

.controls {
    background: rgba(5,18,34,.88);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 25px;
    padding: 15px;
    backdrop-filter: blur(20px);
}

.person-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
}

.person {
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.05);
    color: #9eb3c8;
    padding: 11px;
    border-radius: 13px;
    cursor: pointer;
}

.person.active {
    background: #123f68;
    color: white;
    border-color: #2d8dd0;
}

.input-row {
    display: flex;
    gap: 9px;
}

.text-input {
    flex: 1;
    min-width: 0;
    background: #091d33;
    border: 1px solid rgba(255,255,255,.1);
    color: white;
    padding: 14px;
    border-radius: 15px;
    outline: none;
    font-size: 15px;
}

.text-input:focus {
    border-color: #319de5;
}

.send {
    width: 52px;
    border: 0;
    border-radius: 15px;
    background: #1685cc;
    color: white;
    font-size: 21px;
    cursor: pointer;
}

.mic-area {
    text-align: center;
    margin-top: 15px;
}

.mic {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 3px solid #237eb8;
    background: radial-gradient(circle, #12659c, #08233d);
    color: white;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(34,151,220,.2);
}

.mic.recording {
    border-color: #ff4d6d;
    background: radial-gradient(circle, #a51f42, #3a1020);
    animation: pulse 1.1s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.08);
        box-shadow: 0 0 35px rgba(255,77,109,.4);
    }
}

.mic-label {
    margin-top: 7px;
    color: #819bb2;
    font-size: 12px;
}

.bottom-actions {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
}

.action {
    background: transparent;
    border: 1px solid rgba(255,255,255,.1);
    color: #819bb2;
    padding: 8px 13px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 12px;
}

.loading {
    display: inline-flex;
    gap: 4px;
    align-items: center;
}

.loading span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #54b7ff;
    animation: blink .8s infinite alternate;
}

.loading span:nth-child(2) {
    animation-delay: .2s;
}

.loading span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes blink {
    from { opacity: .2; }
    to { opacity: 1; }
}

@media(max-width:500px) {
    .app {
        padding: 12px;
    }

    .logo {
        font-size: 36px;
    }

    .bubble {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">Lis<span>an</span></div>
    <div class="subtitle">Universal Real-Time Language Communication</div>

    <div class="status">
        <span class="dot"></span>
        Gemini Translation
    </div>
</header>

<div class="languages">

    <div class="language" id="person1Language">
        <div class="flag">🇸🇦</div>
        <strong>العربية</strong>
        <small>الشخص الأول</small>
    </div>

    <button class="swap" onclick="swapLanguages()">⇄</button>

    <div class="language" id="person2Language">
        <div class="flag">🇺🇸</div>
        <strong>English</strong>
        <small>الشخص الثاني</small>
    </div>

</div>

<div class="chat" id="chat">

    <div class="empty" id="empty">
        <div class="big">🗣️</div>
        <div>ابدأ المحادثة</div>
        <small>تحدث أو اكتب، وسيقوم Lisan بالترجمة تلقائيًا</small>
    </div>

</div>

<div class="controls">

    <div class="person-selector">

        <button
            class="person active"
            id="person1Btn"
            onclick="selectPerson(1)">
            👤 الشخص الأول
        </button>

        <button
            class="person"
            id="person2Btn"
            onclick="selectPerson(2)">
            👤 الشخص الثاني
        </button>

    </div>

    <div class="input-row">

        <input
            class="text-input"
            id="textInput"
            placeholder="اكتب رسالة..."
            autocomplete="off">

        <button class="send" onclick="sendText()">➤</button>

    </div>

    <div class="mic-area">

        <button
            class="mic"
            id="micButton"
            onclick="toggleMic()">
            🎙️
        </button>

        <div class="mic-label" id="micLabel">
            اضغط للتحدث
        </div>

    </div>

    <div class="bottom-actions">

        <button class="action" onclick="clearChat()">
            مسح المحادثة
        </button>

        <button class="action" onclick="testTranslation()">
            اختبار الترجمة
        </button>

    </div>

</div>

</div>

<script>

/* =========================================================
   Lisan
   Gemini API
   ========================================================= */

/*
   ضع مفتاح Gemini هنا فقط للتجربة الشخصية.

   مثال:
   const API_KEY = "AIza....";
*/

const API_KEY = "";

/* حالة التطبيق */

let currentPerson = 1;

let person1Arabic = true;

let isListening = false;

let recognition = null;


/* =========================================================
   اللغة
   ========================================================= */

function getPersonLanguage(person) {

    if (person === 1) {
        return person1Arabic ? "Arabic" : "English";
    }

    return person1Arabic ? "English" : "Arabic";
}


function getPersonLanguageArabic(person) {

    return getPersonLanguage(person) === "Arabic";
}


/* =========================================================
   اختيار الشخص
   ========================================================= */

function selectPerson(person) {

    currentPerson = person;

    document
        .getElementById("person1Btn")
        .classList.toggle("active", person === 1);

    document
        .getElementById("person2Btn")
        .classList.toggle("active", person === 2);

    updatePlaceholder();
}


function updatePlaceholder() {

    const input = document.getElementById("textInput");

    if (getPersonLanguage(currentPerson) === "Arabic") {

        input.placeholder = "اكتب بالعربية...";

    } else {

        input.placeholder = "Type in English...";

    }
}


/* =========================================================
   تبديل اللغات
   ========================================================= */

function swapLanguages() {

    person1Arabic = !person1Arabic;

    const p1 = document.getElementById("person1Language");
    const p2 = document.getElementById("person2Language");

    if (person1Arabic) {

        p1.innerHTML = `
            <div class="flag">🇸🇦</div>
            <strong>العربية</strong>
            <small>الشخص الأول</small>
        `;

        p2.innerHTML = `
            <div class="flag">🇺🇸</div>
            <strong>English</strong>
            <small>الشخص الثاني</small>
        `;

    } else {

        p1.innerHTML = `
            <div class="flag">🇺🇸</div>
            <strong>English</strong>
            <small>الشخص الأول</small>
        `;

        p2.innerHTML = `
            <div class="flag">🇸🇦</div>
            <strong>العربية</strong>
            <small>الشخص الثاني</small>
        `;
    }

    updatePlaceholder();
}


/* =========================================================
   Gemini Translation
   ========================================================= */

async function translateForDirection(text, sourceArabic) {

    const source = sourceArabic ? "Arabic" : "English";

    const target = sourceArabic ? "English" : "Arabic";

    if (!API_KEY || API_KEY === "YOUR_GEMINI_API_KEY") {

        alert("ضع مفتاح Gemini API في أعلى الكود أولاً.");

        throw new Error("Gemini API key missing");

    }

    const prompt = `
You are a professional real-time conversational translator.

Translate the following message from ${source} to ${target}.

Rules:
- Return ONLY the translation.
- Do not explain.
- Do not add quotation marks.
- Preserve the exact meaning.
- Make it sound natural in everyday conversation.
- Do not add information.
- Do not remove information.

Text:
${text}
`;

    const response = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": API_KEY
            },

            body: JSON.stringify({
                contents: [
                    {
                        parts: [
                            {
                                text: prompt
                            }
                        ]
                    }
                ]
            })
        }
    );

    const data = await response.json();

    console.log("Gemini response:", data);

    if (!response.ok) {

        throw new Error(
            data?.error?.message ||
            "Gemini translation failed"
        );

    }

    const translation =
        data?.candidates?.[0]?.content?.parts?.[0]?.text;

    if (!translation) {

        throw new Error("No translation returned");

    }

    return translation.trim();
}


/* =========================================================
   إرسال نص
   ========================================================= */

async function sendText() {

    const input = document.getElementById("textInput");

    const text = input.value.trim();

    if (!text) return;

    input.value = "";

    const sourceArabic =
        getPersonLanguageArabic(currentPerson);

    const messageId =
        "msg_" + Date.now();

    addMessage(
        text,
        "جاري الترجمة...",
        sourceArabic,
        messageId
    );

    try {

        const translation =
            await translateForDirection(
                text,
                sourceArabic
            );

        updateTranslation(
            messageId,
            translation
        );

        speak(
            translation,
            !sourceArabic
        );

    } catch (error) {

        console.error(error);

        updateTranslation(
            messageId,
            "تعذر الاتصال بخدمة الترجمة"
        );
    }
}


/* =========================================================
   إضافة رسالة
   ========================================================= */

function addMessage(
    original,
    translation,
    sourceArabic,
    messageId
) {

    const chat =
        document.getElementById("chat");

    const empty =
        document.getElementById("empty");

    if (empty) {
        empty.remove();
    }

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (sourceArabic ? "arabic" : "english");

    wrapper.id = messageId;

    wrapper.innerHTML = `

        <div class="bubble">

            <div class="original">
                ${escapeHTML(original)}
            </div>

            <div class="translation">
                ${escapeHTML(translation)}
            </div>

        </div>

        <div class="meta">
            ${sourceArabic ? "العربية → English" : "English → العربية"}
        </div>

    `;

    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;
}


/* =========================================================
   تحديث الترجمة
   ========================================================= */

function updateTranslation(
    messageId,
    translation
) {

    const message =
        document.getElementById(messageId);

    if (!message) return;

    const translationElement =
        message.querySelector(".translation");

    if (translationElement) {

        translationElement.innerHTML =
            escapeHTML(translation);

    }
}


/* =========================================================
   Microphone
   ========================================================= */

function setupRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        return null;

    }

    const rec = new SpeechRecognition();

    rec.continuous = false;

    rec.interimResults = true;

    rec.maxAlternatives = 1;

    rec.onstart = function() {

        isListening = true;

        document
            .getElementById("micButton")
            .classList.add("recording");

        document
            .getElementById("micLabel")
            .textContent = "جاري الاستماع...";

    };


    rec.onresult = function(event) {

        let transcript = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            transcript +=
                event.results[i][0].transcript;

        }

        document
            .getElementById("textInput")
            .value = transcript;

    };


    rec.onerror = function(event) {

        console.error(
            "Speech recognition error:",
            event.error
        );

        stopMic();

        if (event.error === "not-allowed") {

            alert(
                "اسمح للمتصفح باستخدام الميكروفون."
            );

        }

    };


    rec.onend = function() {

        const text =
            document
                .getElementById("textInput")
                .value
                .trim();

        stopMic();

        if (text) {

            sendText();

        }

    };

    return rec;
}


function toggleMic() {

    if (isListening) {

        stopMic();

        return;

    }

    if (!recognition) {

        recognition = setupRecognition();

    }

    if (!recognition) {

        alert(
            "المتصفح لا يدعم التعرف على الكلام."
        );

        return;

    }

    const sourceArabic =
        getPersonLanguageArabic(currentPerson);

    recognition.lang =
        sourceArabic ? "ar-SA" : "en-US";

    try {

        recognition.start();

    } catch (error) {

        console.log(error);

    }
}


function stopMic() {

    isListening = false;

    document
        .getElementById("micButton")
        .classList.remove("recording");

    document
        .getElementById("micLabel")
        .textContent = "اضغط للتحدث";

    if (recognition) {

        try {
            recognition.stop();
        } catch (e) {}

    }
}


/* =========================================================
   Text To Speech
   ========================================================= */

function speak(text, english) {

    if (!("speechSynthesis" in window)) {

        return;

    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang =
        english ? "en-US" : "ar-SA";

    utterance.rate = 0.95;

    utterance.pitch = 1;

    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================================================
   اختبار سريع
   ========================================================= */

async function testTranslation() {

    const sourceArabic =
        getPersonLanguageArabic(currentPerson);

    const testText =
        sourceArabic
            ? "كيف حالك؟"
            : "How are you?";

    const messageId =
        "test_" + Date.now();

    addMessage(
        testText,
        "جاري الترجمة...",
        sourceArabic,
        messageId
    );

    try {

        const translation =
            await translateForDirection(
                testText,
                sourceArabic
            );

        updateTranslation(
            messageId,
            translation
        );

        speak(
            translation,
            !sourceArabic
        );

    } catch (error) {

        console.error(error);

        updateTranslation(
            messageId,
            "فشل الاختبار"
        );

    }
}


/* =========================================================
   مسح المحادثة
   ========================================================= */

function clearChat() {

    const chat =
        document.getElementById("chat");

    chat.innerHTML = `

        <div class="empty" id="empty">

            <div class="big">🗣️</div>

            <div>ابدأ المحادثة</div>

            <small>
                تحدث أو اكتب، وسيقوم Lisan بالترجمة تلقائيًا
            </small>

        </div>

    `;
}


/* =========================================================
   حماية النص
   ========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   Enter للإرسال
   ========================================================= */

document
    .getElementById("textInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendText();

            }

        }
    );


/* تشغيل أولي */

updatePlaceholder();

</script>

</body>
</html>
