<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lisan — Speak Freely</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
  background:#07111f;
  color:white;
  min-height:100vh;
}

.app{
  max-width:500px;
  margin:auto;
  min-height:100vh;
  padding:22px 18px;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  color:#45d9b5;
}

.status{
  background:#102a2c;
  color:#55e0bf;
  padding:8px 12px;
  border-radius:20px;
  font-size:12px;
}

/* HERO */

.hero{
  text-align:center;
  margin:20px 0 25px;
}

.hero h1{
  font-size:38px;
  line-height:1.05;
  letter-spacing:-1.5px;
}

.hero p{
  color:#91a0b4;
  margin-top:12px;
  font-size:15px;
}

/* PEOPLE */

.people{
  display:flex;
  gap:12px;
  margin-bottom:18px;
}

.person{
  flex:1;
  background:#0d1b2d;
  border:1px solid #1b3048;
  border-radius:20px;
  padding:17px;
  text-align:center;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  background:#19334a;
}

.person h3{
  margin-top:9px;
  font-size:15px;
}

.person small{
  color:#77879c;
}

/* CHAT */

.chat{
  flex:1;
  background:#0a1626;
  border:1px solid #172b43;
  border-radius:25px;
  padding:18px;
  min-height:280px;
  overflow:auto;
}

.message{
  margin-bottom:16px;
  max-width:85%;
}

.message.you{
  margin-left:auto;
  text-align:right;
}

.bubble{
  display:inline-block;
  padding:13px 16px;
  border-radius:18px;
  background:#13263b;
  line-height:1.5;
}

.you .bubble{
  background:#164c4b;
}

.translation{
  color:#55dfbe;
  font-size:13px;
  margin-top:6px;
}

.empty{
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#607187;
}

/* MIC */

.mic-area{
  text-align:center;
  padding:22px 0 10px;
}

.mic{
  width:82px;
  height:82px;
  border-radius:50%;
  border:none;
  background:#45d9b5;
  color:#06141c;
  font-size:31px;
  cursor:pointer;
  box-shadow:0 0 0 10px rgba(69,217,181,.08);
  transition:.2s;
}

.mic.listening{
  background:#ff5f6d;
  color:white;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.08);
    box-shadow:0 0 0 20px rgba(255,95,109,.08);
  }
}

.mic-text{
  margin-top:12px;
  color:#8393a7;
  font-size:13px;
}

/* LANGUAGE */

.language{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-top:10px;
}

.lang{
  background:#102035;
  border:1px solid #223952;
  padding:9px 14px;
  border-radius:14px;
  font-size:13px;
}

.arrow{
  color:#45d9b5;
}

/* DEMO */

.demo{
  margin-top:16px;
  text-align:center;
  color:#52667d;
  font-size:11px;
}

button{
  font-family:inherit;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">L<span>i</span>san</div>
    <div class="status">● LIVE DEMO</div>
  </div>

  <div class="hero">
    <h1>Speak freely.<br>Understand instantly.</h1>
    <p>تحدث بلغتك، ودع Lisan يتكفل بالباقي.</p>
  </div>

  <div class="people">

    <div class="person">
      <div class="avatar">🇸🇦</div>
      <h3>أنت</h3>
      <small>العربية</small>
    </div>

    <div class="person">
      <div class="avatar">🇺🇸</div>
      <h3>الشخص الآخر</h3>
      <small>English</small>
    </div>

  </div>

  <div class="chat" id="chat">

    <div class="empty" id="empty">
      اضغط على الميكروفون<br>
      وابدأ المحادثة 🎙️
    </div>

  </div>

  <div class="language">
    <div class="lang">🇸🇦 العربية</div>
    <div class="arrow">⇄</div>
    <div class="lang">🇺🇸 English</div>
  </div>

  <div class="mic-area">
    <button class="mic" id="mic">🎙️</button>
    <div class="mic-text" id="micText">
      اضغط للتحدث
    </div>
  </div>

  <div class="demo">
    Lisan • Universal Human Communication
  </div>

</div>


<script>

const mic = document.getElementById("mic");
const micText = document.getElementById("micText");
const chat = document.getElementById("chat");
const empty = document.getElementById("empty");

/*
  DEMO TRANSLATIONS
*/

const translations = {

  "كيف حالك": "How are you?",
  "كيف حالك؟": "How are you?",
  "مرحبا": "Hello",
  "مرحباً": "Hello",
  "مرحبا كيف حالك": "Hello, how are you?",
  "السلام عليكم": "Peace be upon you",
  "ما اسمك": "What is your name?",
  "أين أنت": "Where are you?",
  "ماذا تفعل": "What are you doing?",
  "شكرا": "Thank you",
  "شكراً": "Thank you",
  "أراك لاحقا": "See you later",
  "أراك لاحقاً": "See you later",
  "أنا بخير": "I am fine",
  "أحتاج مساعدة": "I need help",
  "أين المستشفى": "Where is the hospital?",

  "hello": "مرحبا",
  "hi": "مرحبا",
  "how are you": "كيف حالك؟",
  "what is your name": "ما اسمك؟",
  "where are you": "أين أنت؟",
  "thank you": "شكرا",
  "thanks": "شكرا",
  "i am fine": "أنا بخير",
  "i need help": "أحتاج مساعدة",
  "where is the hospital": "أين المستشفى؟",
  "see you later": "أراك لاحقاً"

};


/*
  SPEECH RECOGNITION
*/

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let listening = false;

if(SpeechRecognition){

  recognition = new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.lang = "ar-SA";

  recognition.onstart = () => {

    listening = true;

    mic.classList.add("listening");

    mic.textContent = "⏹";

    micText.textContent =
      "جاري الاستماع...";

  };

  recognition.onend = () => {

    listening = false;

    mic.classList.remove("listening");

    mic.textContent = "🎙️";

    micText.textContent =
      "اضغط للتحدث";

  };

  recognition.onerror = () => {

    listening = false;

    mic.classList.remove("listening");

    mic.textContent = "🎙️";

    micText.textContent =
      "حاول مرة أخرى";

  };

  recognition.onresult = (event) => {

    const text =
      event.results[0][0].transcript.trim();

    processText(text);

  };

}else{

  micText.textContent =
    "المتصفح لا يدعم التعرف على الصوت";

}


/*
  MICROPHONE BUTTON
*/

mic.onclick = () => {

  if(!recognition){

    alert(
      "افتح Lisan في Safari أو متصفح يدعم التعرف على الصوت."
    );

    return;
  }

  if(listening){

    recognition.stop();

  }else{

    recognition.lang = "ar-SA";

    recognition.start();

  }

};


/*
  PROCESS
*/

function processText(text){

  empty.style.display = "none";

  const key = text
    .toLowerCase()
    .replace(/[؟?!.,]/g,"")
    .trim();

  let translation =
    translations[key];

  if(!translation){

    translation =
      "Lisan AI Translation";

  }

  addMessage(
    text,
    translation,
    true
  );

  speak(translation, "en-US");

}


/*
  ADD MESSAGE
*/

function addMessage(
  original,
  translated,
  you
){

  const message =
    document.createElement("div");

  message.className =
    "message " +
    (you ? "you" : "");

  message.innerHTML = `

    <div class="bubble">
      ${escapeHtml(original)}
    </div>

    <div class="translation">
      ${escapeHtml(translated)}
    </div>

  `;

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;

}


/*
  SPEAK
*/

function speak(text, language){

  if(!("speechSynthesis" in window))
    return;

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang =
    language;

  utterance.rate =
    0.95;

  window.speechSynthesis.speak(
    utterance
  );

}


/*
  SECURITY
*/

function escapeHtml(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/*
  DEMO MESSAGE
  Shows the concept immediately.
*/

setTimeout(() => {

  empty.style.display = "none";

  addMessage(
    "كيف حالك؟",
    "How are you?",
    true
  );

},700);

</script>

</body>
</html>
