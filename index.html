<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lisan - اختبار المايك</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  width:100%;
  max-width:420px;
  background:#121c2e;
  padding:30px 20px;
  border-radius:25px;
  text-align:center;
}
.logo{
  font-size:50px;
}
h1{
  margin:10px 0;
}
p{
  color:#94a3b8;
}
#status{
  padding:16px;
  background:#0b1220;
  border-radius:15px;
  margin:20px 0;
}
button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:15px;
  font-size:17px;
  font-weight:bold;
  margin-top:10px;
}
#start{
  background:#2563eb;
  color:white;
}
#stop{
  background:#334155;
  color:white;
  display:none;
}
audio{
  width:100%;
  margin-top:20px;
  display:none;
}
.success{
  color:#4ade80;
}
.error{
  color:#f87171;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">🎙️</div>

  <h1>Lisan</h1>

  <p>
    اختبار الميكروفون الحقيقي
  </p>

  <div id="status">
    اضغط تشغيل واسمح للمتصفح باستخدام الميكروفون.
  </div>

  <button id="start">
    🎙️ تشغيل الميكروفون
  </button>

  <button id="stop">
    ⏹️ إيقاف التسجيل
  </button>

  <audio id="player" controls></audio>

</div>

<script>

let stream;
let recorder;
let chunks = [];

const status = document.getElementById("status");
const start = document.getElementById("start");
const stop = document.getElementById("stop");
const player = document.getElementById("player");

start.onclick = async function(){

  if(!window.isSecureContext){
    status.innerHTML =
      "❌ لازم تفتح الصفحة برابط HTTPS.";
    status.className = "error";
    return;
  }

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

    status.innerHTML =
      "❌ المتصفح لا يدعم الميكروفون.";
    status.className = "error";
    return;
  }

  try{

    status.innerHTML =
      "⏳ نطلب إذن الميكروفون...";

    stream = await navigator.mediaDevices.getUserMedia({
      audio:true
    });

    status.innerHTML =
      "🟢 الميكروفون يعمل! تكلم الآن.";

    status.className = "success";

    start.style.display = "none";
    stop.style.display = "block";

    chunks = [];

    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = function(e){

      if(e.data.size > 0){
        chunks.push(e.data);
      }

    };

    recorder.onstop = function(){

      const blob = new Blob(chunks,{
        type:"audio/webm"
      });

      const url = URL.createObjectURL(blob);

      player.src = url;
      player.style.display = "block";

      status.innerHTML =
        "✅ نجح الاختبار! شغّل التسجيل واسمع صوتك.";

    };

    recorder.start();

  }catch(error){

    console.log(error);

    status.innerHTML =
      "❌ رفضت صلاحية الميكروفون أو حدث خطأ.";

    status.className = "error";

  }

};


stop.onclick = function(){

  if(recorder){
    recorder.stop();
  }

  if(stream){

    stream.getTracks().forEach(function(track){
      track.stop();
    });

  }

  stop.style.display = "none";
  start.style.display = "block";

};

</script>

</body>
</html>
